# Single-file programs (Stephen McCamant's large single compilation-unit C
# programs, https://people.csail.mit.edu/smcc/projects/single-file-programs/):
# what is built and how, the same on every system.
SFP=${SFP:-$HOME/sgx-bench/sfp}
# gzip.c is left out: glibc's <string.h> declares strchr, and gzip.c
# defines its own static one, which no compiler flag lets through without
# editing the source.
SFP_PROGS=(${SFP_PROGS_OVERRIDE:-oggenc gcc})
# The sources are from 2004-2006 and are not edited. gcc 15 rejects old C
# by default (implicit declarations and int, K&R definitions, C23 keywords):
# build them as the C they were written in, with those diagnostics made
# warnings again, and no warnings printed. compat/ (searched last) supplies
# headers glibc no longer has: gcc.c includes <sys/sysctl.h> (removed in
# glibc 2.32) but uses nothing from it on Linux (only BSD's HW_PHYSMEM and
# HW_USERMEM), so it gets an empty one.
SFP_CFLAGS="-O2 -std=gnu89 -fpermissive -w -idirafter compat"
# What each build produces: gcc.c compiles but does not link against a
# modern glibc (it uses sys_nerr, gone for new programs since glibc 2.32),
# so it is compiled only (-c), on every system; the others are linked.
sfp_out() {
  case $1 in
    gcc) echo "$1.o" ;;
    *) echo "$1" ;;
  esac
}
sfp_libs() {
  case $1 in
    oggenc|gcc) echo "-lm" ;;
    *) echo "" ;;
  esac
}
