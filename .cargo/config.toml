[target.x86_64-unknown-none]
rustflags = [
    "-C", "linker=gcc",
    "--cfg", "polyval_force_soft",
    "--cfg", "aes_force_soft",
    "--cfg", "mio_unsupported_force_poll_poll",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "linker=musl-gcc",
    "--cfg", "polyval_force_soft",
    "--cfg", "aes_force_soft",
    "--cfg", "mio_unsupported_force_poll_poll",
    # rustix makes its own syscalls by default; through libc they take the
    # SGX shim's direct entry (crates/exec-wasmtime/musl)
    "--cfg", "rustix_use_libc",
]


[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[unstable]
bindeps = true

# In the future when sparse registries are the default, this key can be removed
[registries.crates-io]
protocol = "sparse"
